<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet" />
    <title id="profile">Profile - CitizenLink</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/toast.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/components/clock.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/viewport-fix.css" />
    <script type="module" src="/js/utils/theme.js"></script>
    <link rel="stylesheet" href="/css/pages/profile.css" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="app-container">
        <div class="header-container"></div>
        <div id="sidebar" class="collapsible"></div>
        <div id="dashboard-clock" class="dashboard-clock" aria-live="polite"></div>
        <div id="app" class="collapsible">
            <div class="profile-page-container">
                <!-- Left Sidebar: Static User Info -->
                <aside class="glass-panel profile-sidebar">
                    <div class="profile-avatar-section">
                        <div id="profile-initial" class="avatar-large">U</div>
                        <h1 id="profile-name-display" class="profile-name">Loading...</h1>
                        <span id="profile-role-display" class="profile-role-badge">Role</span>

                        <div class="profile-stats-grid">
                            <div class="stat-item">
                                <span id="stat-total" class="stat-value">-</span>
                                <span class="stat-label">Total Reports</span>
                            </div>
                            <div class="stat-item">
                                <span id="stat-active" class="stat-value">-</span>
                                <span class="stat-label">Active</span>
                            </div>
                            <div class="stat-item">
                                <span id="stat-resolved" class="stat-value">-</span>
                                <span class="stat-label">Resolved</span>
                            </div>
                            <div class="stat-item">
                                <span id="member-since" class="stat-value">-</span>
                                <span class="stat-label">Member Since</span>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Contact Details</h3>
                        <div class="flex flex-col gap-3 text-sm">
                            <div>
                                <span class="block text-gray-500 text-xs">Email</span>
                                <span id="profile-email-display" class="font-medium text-gray-800">loading...</span>
                            </div>
                            <div>
                                <span class="block text-gray-500 text-xs">Address</span>
                                <span id="profile-address-display" class="font-medium text-gray-800">loading...</span>
                            </div>
                            <div>
                                <span class="block text-gray-500 text-xs">Mobile</span>
                                <span id="profile-mobile-display" class="font-medium text-gray-800">loading...</span>
                            </div>
                        </div>
                            <div class="h-20 bg-gray-100 rounded-lg"></div>
                            <div class="h-20 bg-gray-100 rounded-lg"></div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/js/lib/supabase-boot.js"></script>
    <script type="module" src="../js/components/header.js"></script>
    <script type="module" src="../js/components/sidebar.js"></script>
    <script type="module" src="../js/auth/authChecker.js"></script>
    <script type="module" src="../js/components/clock.js"></script>
    <script type="module" src="../js/pages/profile.js"></script>
</body>

</html>
