<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet" />
    <title id="profile">profile - D.R.I.M.S.</title>
    <link rel="stylesheet" href="/css/base/style.css" />
    <link rel="stylesheet" href="/css/components/toast.css" />
    <link rel="stylesheet" href="/css/components/sidebar.css" />
    <link rel="stylesheet" href="/css/base/app.css" />
    <link rel="stylesheet" href="/css/components/clock.css" />
    <link rel="stylesheet" href="/css/components/header.css" />
    <link rel="stylesheet" href="/css/layouts/viewportFix.css" />
    <script type="module" src="/js/utils/theme.js"></script>
    <link rel="stylesheet" href="/css/pages/profile.css" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: {
                            900: '#020617',
                            800: '#0f172a',
                            700: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="dark">
    <div class="app-container">
        <div id="sidebar" class="collapsible"></div>
        <div id="dashboard-clock" class="dashboard-clock" aria-live="polite"></div>
        <div id="app" class="collapsible" style="display: flex; flex-direction: column;">
            <div class="header-container"></div>
            <div class="profile-page-container">
                <!-- Left Sidebar: Static User Info -->
                <aside class="glass-panel profile-sidebar">
                    <div class="profile-avatar-section flex flex-col items-center text-center relative">
                        <div class="relative mb-3">
                            <div id="profile-initial" class="avatar-large">U</div>
                            <div class="absolute bottom-1 right-1 w-5 h-5 bg-green-500 rounded-full border-2 border-slate-900 shadow-md"></div>
                        </div>
                        <h1 id="profile-name-display" class="profile-name">Loading...</h1>
                        <span id="profile-role-display" class="profile-role-badge">Role</span>

                        <div class="profile-stats-grid mt-2">
                            <div class="stat-item">
                                <svg class="w-4 h-4 text-blue-400 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                <span id="stat-total" class="stat-value">-</span>
                                <span class="stat-label">Total Reports</span>
                            </div>
                            <div class="stat-item">
                                <svg class="w-4 h-4 text-blue-400 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                                </svg>
                                <span id="stat-active" class="stat-value">-</span>
                                <span class="stat-label">Active</span>
                            </div>
                            <div class="stat-item">
                                <svg class="w-4 h-4 text-blue-400 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                                <span id="stat-resolved" class="stat-value">-</span>
                                <span class="stat-label">Resolved</span>
                            </div>
                            <div class="stat-item">
                                <svg class="w-4 h-4 text-blue-400 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                <span id="member-since" class="stat-value">-</span>
                                <span class="stat-label">Member Since</span>
                            </div>
                        </div>
                    </div>

                    <div class="info-section mt-4 text-left w-full border-t border-slate-800/80 pt-4">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Contact Details</h3>
                        <div class="flex flex-col gap-2.5 text-xs">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-blue-400 shrink-0">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="block text-gray-400 text-[9px] uppercase tracking-wider leading-tight">Email</span>
                                    <span id="profile-email-display" class="font-medium text-white block truncate text-xs leading-tight mt-0.5">loading...</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-blue-400 shrink-0">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="block text-gray-400 text-[9px] uppercase tracking-wider leading-tight">Address</span>
                                    <span id="profile-address-display" class="font-medium text-white block truncate text-xs leading-tight mt-0.5">loading...</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-blue-400 shrink-0">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                    </svg>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="block text-gray-400 text-[9px] uppercase tracking-wider leading-tight">Mobile</span>
                                    <span id="profile-mobile-display" class="font-medium text-white block truncate text-xs leading-tight mt-0.5">loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <main class="profile-main-content">
                    <div id="profile-reports-section" class="profile-reports-section flex-1 flex flex-col">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800/80 shrink-0">
                            <div class="flex items-center justify-between w-full md:w-auto">
                                <h2 class="text-lg font-bold text-white">Recent Reports</h2>
                                <button onclick="window.location.href='/filecomplaint'" class="md:hidden bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-lg shadow-blue-500/20 transition-all shrink-0">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    New Report
                                </button>
                            </div>
                            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                                <div class="relative flex-1 min-w-[140px] md:w-64">
                                    <input type="text" placeholder="Search reports..." class="w-full bg-slate-800/80 border border-slate-700/60 rounded-lg pl-9 pr-4 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                                    <svg class="absolute left-3 top-2.5 text-gray-500 w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                </div>
                                <select class="bg-slate-800/80 border border-slate-700/60 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 shrink-0">
                                    <option>All Status</option>
                                    <option>Pending</option>
                                    <option>Resolved</option>
                                </select>
                                <button onclick="window.location.href='/filecomplaint'" class="hidden md:flex bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-4 py-2 rounded-lg items-center gap-2 shadow-lg shadow-blue-500/20 transition-all shrink-0">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    New Report
                                </button>
                            </div>
                        </div>
                        <div id="activity-list" class="flex-1 flex flex-col overflow-y-auto pr-2 space-y-3">
                            <!-- Skeleton loader -->
                            <div class="skeleton h-20 bg-slate-800/50 rounded-xl border border-slate-700/30 animate-pulse"></div>
                            <div class="skeleton h-20 bg-slate-800/50 rounded-xl border border-slate-700/30 animate-pulse"></div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/js/lib/supabaseBoot.js"></script>
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/sidebar.js"></script>
    <script type="module" src="/js/auth/authChecker.js"></script>
    <script type="module" src="/js/components/clock.js"></script>
    <script type="module" src="/js/pages/profile.js"></script>
</body>

</html>
