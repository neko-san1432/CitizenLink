<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>Digos City Map</title>
    <link rel="stylesheet" href="/css/base/style.css" />
    <link rel="stylesheet" href="/css/components/sidebar.css" />
    <link rel="stylesheet" href="/css/components/header.css" />
    <link rel="stylesheet" href="/css/complaintForm.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      body.page-digos-map .complaint-wizard-container {
        max-width: min(1700px, calc(100vw - 120px));
        width: 100%;
        padding-top: 8px;
        padding-bottom: 16px;
      }

      body.page-digos-map .page-header {
        margin-bottom: 0.75rem;
      }

      body.page-digos-map .page-title {
        font-size: 1.85rem;
        margin-bottom: 0.2rem;
      }

      body.page-digos-map .page-subtitle {
        font-size: 0.98rem;
      }

      body.page-digos-map .form-section {
        padding: 1rem;
      }

      body.page-digos-map .section-header {
        margin-bottom: 0.75rem;
        padding-bottom: 0.6rem;
      }

      body.page-digos-map .section-header h3 {
        font-size: 1.08rem;
      }

      /* Visually obvious equal inset around the map canvas */
      body.page-digos-map .map-wrapper {
        margin: 0 14px !important;
        border-radius: 12px !important;
      }

      @media (max-width: 1024px) {
        body.page-digos-map .complaint-wizard-container {
          max-width: 100%;
          padding-top: 6px;
          padding-bottom: 12px;
        }

        body.page-digos-map .map-wrapper {
          margin: 0 10px !important;
        }
      }

      #digos-map {
        height: 40vh;
        max-height: 460px;
        min-height: 240px;
        width: 100%;
        border-radius: 12px;
        z-index: 1;
      }

      @supports (height: 100dvh) {
        #digos-map {
          height: 40dvh;
        }
      }
      /* Fix for leaflet z-index in premium cards */
      .leaflet-pane {
        z-index: 10;
      }
      .leaflet-top,
      .leaflet-bottom {
        z-index: 20;
      }
    </style>
  </head>
  <body class="page-digos-map">
    <div class="app-container">
      <div id="sidebar" class="collapsible"></div>

      <div id="app" class="collapsible" style="display: flex; flex-direction: column;">
        <div class="header-container"></div>

        <div class="dashboard-main-wrapper main-content-wrapper" style="display: flex; flex-direction: column; flex: 1;">
          <div class="complaint-wizard-container">
          <!-- Page Header -->
          <div class="page-header">
            <h1 class="page-title">Digos City Barangay Map</h1>
            <p class="page-subtitle">
              Explore the official boundaries and zones of Digos City barangays.
            </p>
          </div>

          <!-- Map Card -->
          <div class="form-section card-glass">
            <div class="section-header">
              <div class="section-icon">🗺️</div>
              <h3>City Boundaries</h3>
            </div>

            <div
              class="map-wrapper"
              style="border: 2px solid #e5e7eb; box-shadow: none"
            >
              <div id="digos-map"></div>
            </div>

            <div
              style="
                margin-top: 1.5rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                color: #6b7280;
                font-size: 0.9rem;
                background: #f9fafb;
                padding: 0.75rem;
                border-radius: 8px;
              "
            >
              <span>💡</span>
              <span
                ><strong>Tip:</strong> Click or tap on any colored area to view
                the Barangay name.</span
              >
            </div>
          </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/js/components/header.js"></script>
    <script type="module" src="/js/components/sidebar.js"></script>
    <script src="/js/pages/digosMap.js"></script>
  </body>
</html>
