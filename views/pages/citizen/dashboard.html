<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/toast.css" />
  <link rel="stylesheet" href="/css/components/clock.css" />
  <link rel="stylesheet" href="/css/components/sidebar.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/pages/dashboardCommon.css" />
  <link rel="stylesheet" href="/css/pages/dashboardRedesign.css" />
  <link rel="stylesheet" href="/css/viewportFix.css" />
  <script type="module" src="/js/utils/theme.js"></script>

</head>

<body>
  <div id="dashboard-clock" class="dashboard-clock" aria-live="polite"></div>
  <div class="app-container">
    <div id="sidebar" class="collapsible"></div>

    <div id="app" class="collapsible citizen-dashboard" style="display: flex; flex-direction: column;">
      <div class="header-container"></div>

      <div class="dashboard-main-wrapper" style="display: flex; flex-direction: column; flex: 1;">
        <!-- Welcome Section -->
        <div class="dashboard-header-section">
          <h1 class="text-2xl font-bold text-gray-800">My Dashboard</h1>
          <p class="text-gray-600">
            Track your report status and history.
          </p>
        </div>

        <!-- Main Content Grid -->
        <div class="dashboard-content gap-6 p-6 relative" style="flex: 1;">
          <!-- Global Skeleton Loader -->
          <div id="dashboard-loading" class="dashboard-loading"
            style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%;">
            <!-- Top Row: Quick Actions & Recent Activity Skeleton -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
              <div class="glass-panel" style="padding: 1rem;">
                <div class="skeleton" style="height: 24px; width: 150px; border-radius: 4px; border-radius: 4px;"></div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                  <div class="skeleton" style="height: 140px; border-radius: 12px;"></div>
                  <div class="skeleton" style="height: 140px; border-radius: 12px;"></div>
                </div>
              </div>
              <div class="glass-panel" style="padding: 1rem;">
                <div class="skeleton" style="height: 24px; width: 180px; border-radius: 4px;"></div>
                <div class="space-y-3 mt-4">
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                </div>
              </div>
            </div>
            <!-- Content Widgets Skeleton -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              <div class="glass-panel" style="padding: 1rem; border-radius: 12px; height: 350px;">
                <div class="skeleton" style="height: 24px; width: 120px; border-radius: 4px; margin-bottom: 1rem;">
                </div>
                <div class="skeleton" style="height: 80px; border-radius: 8px; margin-bottom: 0.75rem;"></div>
                <div class="skeleton" style="height: 80px; border-radius: 8px; margin-bottom: 0.75rem;"></div>
                <div class="skeleton" style="height: 80px; border-radius: 8px;"></div>
              </div>
              <div class="glass-panel" style="padding: 1rem; border-radius: 12px; height: 350px;">
                <div class="skeleton" style="height: 24px; width: 140px; border-radius: 4px; margin-bottom: 1rem;">
                </div>
                <div class="skeleton" style="height: 80px; border-radius: 8px; margin-bottom: 0.75rem;"></div>
                <div class="skeleton" style="height: 80px; border-radius: 8px; margin-bottom: 0.75rem;"></div>
                <div class="skeleton" style="height: 80px; border-radius: 8px;"></div>
              </div>
              <div class="glass-panel" style="padding: 1rem; border-radius: 12px; height: 350px;">
                <div class="skeleton" style="height: 24px; width: 160px; border-radius: 4px; margin-bottom: 1rem;">
                </div>
                <div class="skeleton" style="height: 80px; border-radius: 8px; margin-bottom: 0.75rem;"></div>
                <div class="skeleton" style="height: 80px; border-radius: 8px; margin-bottom: 0.75rem;"></div>
                <div class="skeleton" style="height: 80px; border-radius: 8px;"></div>
              </div>
            </div>
            <!-- Charts Row Skeleton -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="skeleton" style="height: 300px; border-radius: 12px; grid-column: span 2;"></div>
              <div class="skeleton" style="height: 300px; border-radius: 12px;"></div>
            </div>
          </div>

          <!-- Dashboard Real Content -->
          <div id="dashboard-main-content" style="display: none; opacity: 0; transition: opacity 0.3s ease;">
            <!-- Top Row: Quick Actions & Recent Activity -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
              <!-- Quick Actions -->
              <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Quick Actions</h3>
                <div class="grid grid-cols-2 gap-4">
                  <button
                    class="flex flex-col items-center justify-center p-6 bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-xl transition-all shadow-sm hover:shadow-md group h-full quick-action-btn"
                    data-href="/filecomplaint">
                    <div
                      class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                      </svg>
                    </div>
                    <h4 class="font-semibold text-gray-900 text-lg">File complaint</h4>
                    <p class="text-sm text-gray-500 mt-2 text-center">Submit a new report</p>
                  </button>

                  <button
                    class="flex flex-col items-center justify-center p-6 bg-white hover:bg-purple-50 border border-gray-200 hover:border-purple-300 rounded-xl transition-all shadow-sm hover:shadow-md group h-full quick-action-btn"
                    data-href="/profile">
                    <div
                      class="w-14 h-14 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                    </div>
                    <h4 class="font-semibold text-gray-900 text-lg">My profile</h4>
                    <p class="text-sm text-gray-500 mt-2 text-center">Manage details</p>
                  </button>
                </div>
              </div>

              <!-- Recent Activity -->
              <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-lg font-semibold text-gray-800">Recent Status Updates</h3>
                  <a href="/profile" class="text-sm text-blue-600 hover:text-blue-800 font-medium">View All</a>
                </div>
                <div id="recent-activity-list" class="space-y-3">
                  <!-- Loading State -->
                  <div class="animate-pulse space-y-3">
                    <div class="h-16 bg-gray-100 rounded-lg"></div>
                    <div class="h-16 bg-gray-100 rounded-lg"></div>
                    <div class="h-16 bg-gray-100 rounded-lg"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Announcements & Feed Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
              <!-- Urgent Notices -->
              <div
                class="bg-red-50 p-4 rounded-xl shadow-sm border border-red-100 flex flex-col h-[320px] lg:h-[380px]">
                <h3 class="text-lg font-semibold text-red-800 mb-4 flex items-center gap-2 flex-shrink-0 leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                  Advisories & Notices
                </h3>
                <div id="urgent-notices-feed" class="space-y-3 flex-1 overflow-y-auto pr-2"
                  style="-webkit-overflow-scrolling: touch;">
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                </div>
              </div>

              <!-- City News Feed -->
              <div
                class="bg-blue-50 p-4 rounded-xl shadow-sm border border-blue-100 flex flex-col h-[320px] lg:h-[380px]">
                <h3 class="text-lg font-semibold text-blue-800 mb-4 flex items-center gap-2 flex-shrink-0 leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                  </svg>
                  Latest News
                </h3>
                <div id="news-feed" class="space-y-3 flex-1 overflow-y-auto pr-2"
                  style="-webkit-overflow-scrolling: touch;">
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                </div>
              </div>

              <!-- Upcoming Events -->
              <div
                class="bg-emerald-50 p-4 rounded-xl shadow-sm border border-emerald-100 flex flex-col h-[320px] lg:h-[380px]">
                <h3
                  class="text-lg font-semibold text-emerald-800 mb-4 flex items-center gap-2 flex-shrink-0 leading-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  Upcoming Events
                </h3>
                <div id="events-feed" class="space-y-3 flex-1 overflow-y-auto pr-2"
                  style="-webkit-overflow-scrolling: touch;">
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 72px; border-radius: 8px;"></div>
                </div>
              </div>
            </div>

            <!-- Stats Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <!-- Total Reports -->
              <div
                class="stat-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                  <p class="text-sm text-gray-500 font-medium">Total Submitted</p>
                  <h3 class="text-2xl font-bold text-gray-800" id="stat-total-submitted">-</h3>
                </div>
                <div id="widget-news-list" class="space-y-3 flex-1 overflow-y-auto pr-2">
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                </div>
              </div>

              <!-- Active Notices -->
              <div class="bg-white p-4 rounded-xl shadow-sm border border-orange-100 flex flex-col"
                style="min-height: 350px;">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-lg font-semibold text-gray-800">Active Notices</h3>
                  <a href="/publication#notices" class="text-sm text-blue-600 hover:text-blue-800 font-medium">View
                    All</a>
                </div>
                <div id="widget-notices-list" class="space-y-3 flex-1 overflow-y-auto pr-2">
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                </div>
              </div>

              <!-- Upcoming Events -->
              <div class="bg-white p-4 rounded-xl shadow-sm border border-green-100 flex flex-col"
                style="min-height: 350px;">
                <div class="flex justify-between items-center mb-4">
                  <h3 class="text-lg font-semibold text-gray-800">Upcoming Events</h3>
                  <a href="/publication#events" class="text-sm text-blue-600 hover:text-blue-800 font-medium">View
                    All</a>
                </div>
                <div id="widget-events-list" class="space-y-3 flex-1 overflow-y-auto pr-2">
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                  <div class="skeleton" style="height: 60px; border-radius: 8px;"></div>
                </div>
              </div>
            </div>

            <!-- Charts Row -->
            <div class="overflow-x-auto pb-4 mb-6" style="-webkit-overflow-scrolling: touch;">
              <div class="flex gap-6" style="min-width: 1000px;">
                <!-- Trend Chart -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex-grow" style="flex: 2;">
                  <h3 class="text-lg font-semibold text-gray-800 mb-4">My Activity</h3>
                  <div style="height: 300px; position: relative">
                    <canvas id="trendChart"></canvas>
                  </div>
                </div>

                <!-- Distribution Chart -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex-grow" style="flex: 1;">
                  <h3 class="text-lg font-semibold text-gray-800 mb-4">Report Categories</h3>
                  <div style="height: 300px; position: relative">
                    <canvas id="distributionChart"></canvas>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div> <!-- End dashboard-main-content -->
      </div>
    </div> <!-- End dashboard-main-wrapper -->
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo="
    crossorigin="anonymous"></script>
  <script type="module" src="/js/lib/supabaseBoot.js"></script>
  <script type="module" src="../../js/components/toast.js"></script>
  <script type="module" src="../../js/components/header.js"></script>
  <script type="module" src="../../js/components/sidebar.js"></script>
  <script type="module" src="../../js/auth/authChecker.js"></script>
  <script type="module" src="../../js/auth/roleToggle.js"></script>
  <script type="module" src="../../js/components/clock.js"></script>
  <script type="module" src="/js/pages/citizenDashboard.js"></script>
</body>

</html>
