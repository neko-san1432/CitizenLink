<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <title>Complete Your Profile - CitizenLink</title>
    <link rel="stylesheet" href="/css/base/style.css">
    <link rel="stylesheet" href="/css/components/toast.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/pages/signup.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .readonly-field {
            background-color: var(--gray-50) !important;
            cursor: not-allowed;
            color: var(--gray-500);
        }

        .form-info-banner {
            background: var(--primary-50);
            border: 1px solid var(--primary-100);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .form-info-banner svg {
            color: var(--primary-600);
            flex-shrink: 0;
            margin-top: 0.125rem;
        }

        .form-info-banner p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--primary-800);
            line-height: 1.5;
        }
    </style>
</head>

<body class="auth-page">
    <!-- Header Container -->
    <div class="header-container">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="brand-logo">
                    <div class="brand-icon"></div>
                    <span class="brand-text">CitizenLink</span>
                </a>
            </div>
            <div class="header-right">
                <div id="unauthenticated-buttons" class="flex items-center gap-2">
                    <a href="/login" id="login-btn" class="btn btn-secondary">Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Background Pattern -->
    <div class="auth-background">
        <div class="auth-pattern"></div>
    </div>

    <!-- Main Content -->
    <main class="auth-container">
        <div class="auth-card">
            <!-- Header Section -->
            <div class="auth-header">
                <h1 class="auth-title">Complete Your Profile</h1>
                <p class="auth-subtitle">Verify your details to access your LGU staff account</p>
            </div>

            <!-- Form Section -->
            <div class="auth-form">
                <div class="form-info-banner">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <p>We've retrieved some information from your login provider. Please confirm your details and
                        provide a mobile number to continue.</p>
                </div>

                <form id="positionSignupForm" class="signup-form">
                    <!-- Hidden Fields for JS Logic -->
                    <input type="hidden" id="signupCode" name="signupCode">
                    <input type="hidden" id="role" name="role">
                    <input type="hidden" id="department" name="department">

                    <!-- Full Name Field (Read-only) -->
                    <div class="form-group form-full">
                        <label for="name" class="form-label">Full Name</label>
                        <div class="input-wrapper">
                            <input class="input readonly-field" type="text" id="name" name="name" readonly>
                            <div class="input-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Email Field (Read-only) -->
                    <div class="form-group form-full">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <input class="input readonly-field" type="email" id="email" name="email" readonly>
                            <div class="input-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <polyline points="22,6 12,13 2,6" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Phone Field -->
                    <div class="form-group form-full">
                        <label for="mobile" class="form-label">Phone Number</label>
                        <div class="phone-input-wrapper">
                            <div class="phone-prefix">+63</div>
                            <input class="input phone-input" type="tel" id="mobile" name="mobile"
                                placeholder="9123456789" maxlength="10" pattern="[0-9]{10}" required>
                        </div>
                        <small class="form-hint">Used for important LGU notifications.</small>
                    </div>

                    <!-- Privacy Consent -->
                    <div class="form-group form-full">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="toc" name="toc" required>
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-label">
                                I agree to the <a href="/terms" target="_blank" class="auth-link">Terms of Service</a>
                                and <a href="/privacy-notice" target="_blank" class="auth-link">Privacy Policy</a>
                            </span>
                        </label>
                    </div>

                    <!-- CAPTCHA Placeholder -->
                    <div id="captcha-container" class="form-full" style="margin-top: 1rem;">
                        <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
                    </div>

                    <!-- Submit Button -->
                    <button class="btn btn-primary btn-lg w-full form-full" type="submit" style="margin-top: 2rem;">
                        <span class="button-text">Complete Registration</span>
                        <div class="button-loading" style="display: none; align-items: center; gap: 0.5rem;">
                            <span class="spinner"
                                style="width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;"></span>
                            Please wait...
                        </div>
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Wrong account? <a href="/logout" class="auth-link">Sign out</a></p>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script type="module" src="/js/components/toast.js"></script>
    <script type="module" src="/js/auth/completePositionSignup.js"></script>
    <script type="module" src="/js/auth/authChecker.js"></script>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
