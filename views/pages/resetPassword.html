<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - DRIMS</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  
  <!-- Core Styles -->
  <link rel="stylesheet" href="/css/base/style.css" />
  <link rel="stylesheet" href="/css/components/toast.css" />
  <link rel="stylesheet" href="/css/components/header.css" />
  
  <!-- Page Specific (Matched to Login with fixes) -->
  <link rel="stylesheet" href="/css/pages/resetPassword.css" />
  
  <script type="module" src="/js/utils/theme.js"></script>
</head>

<body class="auth-page">
  <!-- Background Elements (Copied from Login) -->
  <div class="background-gradient"></div>
  <div class="grid-overlay"></div>

  <!-- Navigation (Exact Copy from Login) -->
  <nav class="navbar glass-nav">
    <div class="nav-container">
      <a href="/" class="logo" style="text-decoration: none; display: flex; align-items: center; color: inherit;">
        <div class="logo-icon">
          <img src="/assets/images/dRIMSIconRemovebgPreview.png" alt="Logo"
            style="height: 48px; width: auto; object-fit: contain;">
        </div>
        <span class="brand-text" style="font-size: 1.5rem; margin-left: 8px; font-weight: 700; color: white;">DRIMS</span>
      </a>
      <div class="nav-links">
        <a href="/" style="color: var(--text-dim);">Home</a>
        <a href="/#features" style="color: var(--text-dim);">Features</a>
        <a href="/login" class="nav-link-secondary" style="color: var(--text-light); font-weight: 600;">Login</a>
        <a href="/signup" class="btn-primary-sm">Get Started</a>
      </div>
    </div>
  </nav>

  <!-- Main Content (Matched to Login Container) -->
  <main class="auth-container">
    <div class="auth-card">
      <!-- Header Section -->
      <div class="auth-header">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Securely regain access to your account</p>
      </div>

      <!-- Content Section -->
      <div class="auth-main">
        
        <!-- Mode: Recovery (From Email Link) -->
        <div id="mode-recovery" style="display: none">
          <form id="reset-form" class="space-y-4">
            <div class="form-group">
              <label for="new-password" class="form-label">New Password</label>
              <div class="input-wrapper">
                <input id="new-password" class="input form-control has-icon" type="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
                <div class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </div>
              </div>
              <div class="password-strength">
                <div class="strength-bar">
                  <div class="strength-fill" id="strength-fill-recovery"></div>
                </div>
                <span class="strength-text" id="strength-text-recovery">Password strength</span>
              </div>
            </div>
            
            <div class="form-group">
              <label for="confirm-password" class="form-label">Confirm Password</label>
              <div class="input-wrapper">
                <input id="confirm-password" class="input form-control has-icon" type="password" placeholder="Repeat new password" autocomplete="new-password" required />
                <div class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                  </svg>
                </div>
              </div>
            </div>
            
            <button id="reset-btn" class="btn btn-primary btn-lg w-full" type="submit">
              Update Password
            </button>
          </form>
        </div>

        <!-- Mode: Logged In (Profile Change) -->
        <div id="mode-logged-in" style="display: none">
          <form id="change-form" class="space-y-4">
            <div class="form-group">
              <label for="current-password" class="form-label">Current Password</label>
              <div class="input-wrapper">
                <input id="current-password" class="input form-control has-icon" type="password" placeholder="Verify identity" autocomplete="current-password" required />
                <div class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
              </div>
            </div>
            
            <div class="form-group">
              <label for="new-password-li" class="form-label">New Password</label>
              <div class="input-wrapper">
                <input id="new-password-li" class="input form-control has-icon" type="password" placeholder="New secure password" autocomplete="new-password" required />
                <div class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </div>
              </div>
              <div class="password-strength">
                <div class="strength-bar">
                  <div class="strength-fill" id="strength-fill-li"></div>
                </div>
                <span class="strength-text" id="strength-text-li">Password strength</span>
              </div>
            </div>
            
            <div class="form-group">
              <label for="confirm-password-li" class="form-label">Confirm New Password</label>
              <div class="input-wrapper">
                <input id="confirm-password-li" class="input form-control has-icon" type="password" placeholder="Repeat new password" autocomplete="new-password" required />
                <div class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                  </svg>
                </div>
              </div>
            </div>
            
            <button id="change-btn" class="btn btn-primary btn-lg w-full" type="submit">
              Change Password
            </button>
          </form>
        </div>

        <!-- Mode: Request (Forgot Password) -->
        <div id="mode-request" style="display: block">
          <form id="request-form" method="post" action="/api/auth/forgot-password" class="space-y-4">
            <div class="form-group">
              <label for="request-email" class="form-label">Email Address</label>
              <div class="input-wrapper">
                <input id="request-email" name="email" class="input form-control has-icon" type="email" placeholder="example@email.com" autocomplete="email" required />
                <div class="input-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </div>
              </div>
            </div>
            
            <button id="request-btn" class="btn btn-primary btn-lg w-full" type="submit">
              Send Reset Link
            </button>
            
            <div id="retry-countdown" style="display: none; text-align: center; margin-top: 1rem; color: #ef4444; font-size: 0.85rem;"></div>
          </form>
        </div>

        <div id="message" style="text-align: center; margin-top: 1.5rem; color: var(--text-dim); font-size: 0.9rem;" aria-live="polite"></div>
      </div>

      <!-- Footer (Matched to Login) -->
      <div class="auth-footer">
        <p>
          Remember your password?
          <a href="/login" class="auth-link">Sign in</a>
        </p>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  
  <script type="module" src="/js/lib/supabaseBoot.js"></script>
  <script type="module" src="/js/auth/authChecker.js"></script>
  <script type="module" src="/js/pages/resetPassword.js"></script>
</body>

</html>
